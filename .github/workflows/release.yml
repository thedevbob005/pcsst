name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          python3 - <<'PY'
          import json
          import os

          package = json.load(open("package.json", "r", encoding="utf-8"))
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{package['version']}"
          if tag != expected:
              raise SystemExit(f"Tag {tag} does not match package version {expected}")
          print(f"Release tag {tag} matches package version")
          PY

      - name: Verify and package PCSST
        run: python3 scripts/package.py

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pcsst-release
          path: releases/*.tgz

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
